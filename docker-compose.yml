# path: crs-microservices/docker-compose.yml
# purpose: dinh nghia 5 service + 3 MySQL container, dung mang noi bo Docker de goi nhau
# qua TEN SERVICE thay vi localhost. Day la file THAM KHAO cho sinh vien tu hoc.
version: '3.8'

services:
  # ==========================================
  # DATABASES
  # ==========================================
  mysql-auth:
    image: mysql:8.0
    container_name: crs-mysql-auth
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: duong205
      MYSQL_DATABASE: auth_db
    ports:
      - "3307:3306"
    volumes:
      - auth_data:/var/lib/mysql

  mysql-course:
    image: mysql:8.0
    container_name: crs-mysql-course
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: duong205
      MYSQL_DATABASE: course_db
    ports:
      - "3308:3306"
    volumes:
      - course_data:/var/lib/mysql

  mysql-registration:
    image: mysql:8.0
    container_name: crs-mysql-registration
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: duong205
      MYSQL_DATABASE: registration_db
    ports:
      - "3309:3306"
    volumes:
      - registration_data:/var/lib/mysql

  # ==========================================
  # BACKEND MICROSERVICES
  # ==========================================
  auth-service:
    build:
      context: ./auth-service
    container_name: crs-auth-service
    depends_on:
      - mysql-auth
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-auth:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: duong205
      JWT_SECRET: CRS-Microservices-Secret-Key-Nam-3-Hoc-Ky-2026-Doi-Trong-Thuc-Te
      JWT_EXPIRATION_MS: 86400000
    ports:
      - "8081:8081"

  course-service:
    build:
      context: ./course-service
    container_name: crs-course-service
    depends_on:
      - mysql-course
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-course:3306/course_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: duong205
      JWT_SECRET: CRS-Microservices-Secret-Key-Nam-3-Hoc-Ky-2026-Doi-Trong-Thuc-Te
    ports:
      - "8082:8082"

  registration-service:
    build:
      context: ./registration-service
    container_name: crs-registration-service
    depends_on:
      - mysql-registration
      - course-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-registration:3306/registration_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: duong205
      JWT_SECRET: CRS-Microservices-Secret-Key-Nam-3-Hoc-Ky-2026-Doi-Trong-Thuc-Te
      # DIEM MAU CHOT: Thay the localhost bang ten service 'course-service' trong mang noi bo Docker
      COURSE_SERVICE_BASE_URL: http://course-service:8082
    ports:
      - "8083:8083"

  api-gateway:
    build:
      context: ./api-gateway
    container_name: crs-api-gateway
    depends_on:
      - auth-service
      - course-service
      - registration-service
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      COURSE_SERVICE_URL: http://course-service:8082
      REGISTRATION_SERVICE_URL: http://registration-service:8083
      JWT_SECRET: CRS-Microservices-Secret-Key-Nam-3-Hoc-Ky-2026-Doi-Trong-Thuc-Te
    ports:
      - "8080:8080"

  # ==========================================
  # FRONTEND APP
  # ==========================================
  crs-frontend:
    build:
      context: ./crs-frontend
    container_name: crs-frontend-app
    depends_on:
      - api-gateway
    ports:
      - "5173:5173"

volumes:
  auth_data:
  course_data:
  registration_data:
